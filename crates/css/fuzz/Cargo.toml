[package]
name = "wb-css-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MPL-2.0"

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: run with `cargo +nightly fuzz run parse`
# from crates/css.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.10"
wb-css = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
