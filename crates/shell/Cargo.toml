[package]
name = "wb-shell"
description = "The browser application: window, tabs, URL bar and settings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "wb_shell"
path = "src/lib.rs"

[[bin]]
name = "web_browser"
path = "src/main.rs"

[package.metadata.layer]
level = 6

[lints]
workspace = true

[dependencies]
encoding_rs = { workspace = true }
png = { workspace = true }
wb-blocker = { path = "../blocker" }
wb-css = { path = "../css" }
wb-dom = { path = "../dom" }
wb-html = { path = "../html" }
wb-image = { path = "../image" }
wb-layout = { path = "../layout" }
wb-net = { path = "../net" }
wb-paint = { path = "../paint" }
wb-style = { path = "../style" }
wb-text = { path = "../text" }
wb-url = { path = "../url" }

[dev-dependencies]
tempfile = { workspace = true }
