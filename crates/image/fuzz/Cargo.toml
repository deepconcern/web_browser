[package]
name = "wb-image-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
wb-image = { path = ".." }

# Not part of the main workspace: fuzzing is run by hand with
# `cargo +nightly fuzz run decode` from `crates/image`.
[workspace]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false
