[package]
name = "wb-net"
description = "HTTP, TLS, cookies, cache, and the network policy gate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.layer]
level = 2

[dependencies]
wb-url = { path = "../url" }
brotli-decompressor = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "sync"] }
tokio-rustls = { workspace = true }
tower-service = { workspace = true }

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[lints]
workspace = true
