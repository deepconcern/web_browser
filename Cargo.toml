[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/deepconcern/web_browser"
rust-version = "1.97"

[workspace.dependencies]
serde_json = "1"
# wb-image decoders (see docs/components.md).
png = { version = "0.18.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "0.5.1", default-features = false, features = ["std"] }
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", default-features = false }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"] }

# Project rules from AGENTS.md, enforced by the compiler and clippy.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# No panics on web input: handle or recover from errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
