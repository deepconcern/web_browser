[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/deepconcern/web_browser"
rust-version = "1.97"

[workspace.dependencies]
serde_json = "1"
# wb-image decoders (see docs/components.md).
png = { version = "0.18.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "0.5.1", default-features = false, features = ["std"] }
gif = { version = "0.14.2", default-features = false, features = ["std"] }
image-webp = { version = "0.2.4", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
fontdb = { version = "0.24.0", default-features = false, features = ["std", "fs", "fontconfig"] }
harfrust = { version = "0.12.0", default-features = false, features = ["std"] }
swash = { version = "0.2.10", default-features = false, features = ["std", "render"] }
unicode-linebreak = "0.1.5"
unicode-script = "0.5.9"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data", "std"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
tempfile = "3.27.0"
url = { version = "2.5.8", default-features = false, features = ["std"] }
# wb-net (HTTP stack). TLS uses the ring provider only: no aws-lc-rs, no webpki-roots.
brotli-decompressor = { version = "6.3.1", default-features = false, features = ["std"] }
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
http = { version = "1.5.0", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = { version = "0.3.3", default-features = false }
cssparser = { version = "0.38.0", default-features = false }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"] }
# wb-paint rasterizer (ADR-0002). No `png-format`: encoding PNGs is not paint's job.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
# wb-shell UI (see docs/components.md). egui's bundled fonts (OFL/UFL) stay
# off: `default_fonts` is never enabled; the shell loads system fonts.
egui = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false, features = ["wayland", "x11", "smithay-clipboard"] }
egui-wgpu = { version = "0.37.0", default-features = false, features = ["winit", "wayland", "x11"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12", "gles"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
pollster = "0.4.0"

# Project rules from AGENTS.md, enforced by the compiler and clippy.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# No panics on web input: handle or recover from errors instead.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

# Optimised, smaller binaries for releases (see .github/workflows/release.yml).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
